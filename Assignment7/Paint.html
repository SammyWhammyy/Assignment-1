<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="paint.css" />
    <title>Paint</title>
  </head>
  <body>
    <div id="toolbar">
      <input type="color" id="color-wheel" value="#000000" />
      <input type="range" id="brush-size" min="1" max="50" value="5" />
      <button id="eraser-btn">Eraser</button>
      <button id="clear-btn">Clear</button>
      <button id="fill-btn">Fill</button>
      <div id="shape-div">
        <input type="range" id="shape-size" min="10" max="300" value="50" />
        <div>
          <button class="shape-btn" id="rect-btn">Rect</button>
          <button class="shape-btn" id="circle-btn">Circle</button>
          <button class="shape-btn" id="mm-btn">Mickey Mouse</button>
        </div>
      </div>
    </div>
    <canvas id="board" width="600" height="400"></canvas>
    <script src="paint.js"></script>
  </body>
</html>
